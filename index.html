<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For My Mom ❤️</title>

  <link rel="stylesheet" href="style.css" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Stars Background -->
  <canvas id="stars"></canvas>

  <!-- Main Card -->
  <div class="container">

    <div class="glass-card">

      <h1 class="title">
        To My Mom ❤️
      </h1>

      <p class="subtitle">
        Happy Birthday & Happy Mother's Day
      </p>

      <div class="typewriter" id="typewriter"></div>

      <button id="loveBtn">
        Open My Heart ✨
      </button>

      <div class="hidden-message" id="hiddenMessage">

        <h2>
          You are my forever hero 🌸
        </h2>

        <p>
          Thank you for every sacrifice,
          every hug,
          every prayer,
          and every smile.
        </p>

        <p class="quote">
          “Home is wherever mom is.”
        </p>

      </div>

    </div>

  </div>

  <script src="script.js"></script>

</body>

</html>
